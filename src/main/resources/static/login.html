<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>coanda - Acceso al Sistema</title>
    <script>
        (function() {
            const sessionStr = localStorage.getItem('coanda_session');
            if (sessionStr) {
                try {
                    const session = JSON.parse(sessionStr);
                    if (session.role === 'TECNICO') {
                        window.location.href = '/index.html';
                    } else if (session.role === 'COMERCIAL' || session.role === 'SUPERVISOR_COMERCIAL') {
                        window.location.href = '/comercial.html';
                    }
                } catch (e) {
                    localStorage.removeItem('coanda_session');
                }
            }
        })();
    </script>
    <!-- Bootstrap 5.3 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link href="css/style.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            margin: 0;
            background-color: var(--coanda-dark);
            padding: 40px 0 0 0;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(46, 125, 50, 0.15) !important;
            margin-bottom: auto;
            margin-top: auto;
        }
        .site-footer {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="card bg-card login-card text-dark">
        <div class="card-body text-center">
            <div class="logo-container mb-4">
                <i class="bi bi-person-lock text-accent display-3 animate-pulse"></i>
            </div>
            <h2 class="h3 fw-bold text-dark mb-2">Acceso al Sistema</h2>
            <p class="text-secondary mb-4">Ingrese sus credenciales de acceso</p>

            <form id="loginForm">
                <div class="mb-3 text-start">
                    <label for="username" class="form-label text-accent">Rol</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-header text-accent border-secondary"><i class="bi bi-person-badge"></i></span>
                        <select class="form-select bg-input text-dark border-secondary" id="username" name="username" required>
                            <option value="tecnico">TÉCNICO</option>
                            <option value="comercial">COMERCIAL</option>
                            <option value="supervisor_comercial">SUPERVISOR COMERCIAL</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3 text-start">
                    <label for="nombre" class="form-label text-accent">Nombre</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-header text-accent border-secondary"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control bg-input text-dark border-secondary" id="nombre" name="nombre" placeholder="Su nombre..." required>
                    </div>
                </div>

                <div class="mb-4 text-start">
                    <label for="password" class="form-label text-accent">Contraseña</label>
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-header text-accent border-secondary"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control bg-input text-dark border-secondary" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Mostrar error si existe -->
                <div id="errorMsg" class="alert alert-danger py-2 d-none" role="alert">
                    Credenciales incorrectas. Inténtelo de nuevo.
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-accent btn-xl w-100 text-white">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
                    </button>
                </div>
            </form>
            <div class="mt-4">
                <a href="/index.html" class="text-secondary small text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Volver al Taller</a>
            </div>
        </div>
    </div>

    <!-- Footer Profesional -->
    <footer class="site-footer">
        <div class="container-fluid text-center">
            <span><span class="text-negro">Web creada y gestionada por </span><span class="author-verde">Alonso Feria Arriaza</span><span class="text-negro"> — coanda </span><span class="author-verde">© 2026</span></span>
        </div>
    </footer>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim().toLowerCase();
            const nombreInput = document.getElementById('nombre').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.classList.add('d-none');

            if (!nombreInput) {
                alert('El nombre es obligatorio.');
                return;
            }

            if (usernameInput === 'tecnico' && passwordInput === '1111') {
                const session = {
                    role: 'TECNICO',
                    token: 'token-tecnico-1111',
                    username: nombreInput
                };
                localStorage.setItem('coanda_session', JSON.stringify(session));
                localStorage.setItem('coanda_tecnico', nombreInput);
                window.location.href = '/index.html';
            } else if (usernameInput === 'comercial' && passwordInput === 'coanda2026') {
                const session = {
                    role: 'COMERCIAL',
                    token: 'token-comercial-coanda2026',
                    username: nombreInput
                };
                localStorage.setItem('coanda_session', JSON.stringify(session));
                window.location.href = '/comercial.html';
            } else if (usernameInput === 'supervisor_comercial' && passwordInput === '1234') {
                const session = {
                    role: 'SUPERVISOR_COMERCIAL',
                    token: 'token-supervisor-1234',
                    username: nombreInput
                };
                localStorage.setItem('coanda_session', JSON.stringify(session));
                window.location.href = '/comercial.html';
            } else {
                errorMsg.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
